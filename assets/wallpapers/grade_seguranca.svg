  <text x="960" y="548" text-anchor="middle" fill="#4a8bc2" fill-opacity="0.25" font-family="Segoe UI, Tahoma, sans-serif" font-size="28" font-weight="bold" letter-spacing="6">VILAS BOAS SECURITY OS</text>
</svg>

