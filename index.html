<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vilas Boas OS</title>
    <meta name="description" content="Simulação do Windows Vista no navegador: área de trabalho Aero, menu Iniciar, janelas e programas.">
    <link rel="icon" href="assets/icons/vista.png">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/session.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/taskbar.css">
    <link rel="stylesheet" href="css/window.css">
    <link rel="stylesheet" href="css/apps.css">
    <link rel="stylesheet" href="css/programs.css">
</head>
<body>
    <main id="desktop" tabindex="-1" aria-label="Área de Trabalho">
        <div id="wallpaper"></div>
        <div id="desk-icons" class="desk-icons"></div>
        <div id="windows"></div>
    </main>

    <footer id="taskbar" aria-label="Barra de tarefas">
        <button id="start-orb" aria-label="Iniciar" data-tip="Iniciar"><span class="orb-glow"></span></button>
        <div id="quicklaunch"></div>
        <div class="tb-grip"></div>
        <div id="tasks"></div>
        <div id="tray">
            <button class="tray-btn" id="tray-net" aria-label="Rede"></button>
            <button class="tray-btn" id="tray-vol" aria-label="Volume"></button>
            <button id="clock" aria-label="Relógio"><span id="clock-time"></span></button>
        </div>
    </footer>

    <div id="session" class="session" aria-live="polite"></div>

    <noscript><p style="color:#fff;padding:20px">O Vilas Boas OS precisa de JavaScript para funcionar.</p></noscript>
    <script type="module" src="js/main.js"></script>
</body>
</html>
