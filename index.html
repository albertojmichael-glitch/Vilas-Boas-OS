<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vilas Boas OS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=W95FA&display=swap" rel="stylesheet">
</head>
<body>

    <main id="desktop">
        </main>

    <footer id="taskbar">
        <button id="start-btn" aria-label="Menu Iniciar">
            <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" alt="Logo" class="start-icon">
            <strong>Iniciar</strong>
        </button>
        
        <div id="open-windows">
            </div>

        <div id="system-tray">
            <span id="clock">12:00 AM</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
