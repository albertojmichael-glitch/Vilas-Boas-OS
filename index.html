<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vilas Boas OS - Vista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="boot-screen">
        <div class="boot-content">
            <h2 class="ms-logo">Vilas Boas Interprises®</h2>
            <div class="progress-bar-container">
                <div class="progress-indicator"></div>
            </div>
            <p class="corp-text">© Vilas Boas Corporation</p>
        </div>
    </div>

    <main id="desktop">
        </main>

    <footer id="taskbar">
        <button id="start-orb" aria-label="Menu Iniciar">
            <div class="start-logo">
                <span></span>
            </div>
        </button>
        
        <div id="open-windows"></div>

        <div id="system-tray">
            <span id="clock">12:00 AM</span>
        </div>
    </footer>

    <script src="script.js"></script>

    <main id="desktop">
        <div class="desktop-icon" ondblclick="abrirJanela('notepad-window')">
            <div class="icon-img icon-txt"></div>
            <span>LEIA-ME.txt</span>
        </div>
    </main>

    <div class="window hidden" id="notepad-window" onmousedown="trazerParaFrente('notepad-window')">
        <div class="window-header">
            <span class="window-title">LEIA-ME.txt - Bloco de Notas</span>
            <div class="window-controls">
                <button class="win-btn-close" onclick="fecharJanela('notepad-window')">X</button>
            </div>
        </div>
        <div class="window-content">
            <textarea readonly>
Acho que alguém andou mexendo no meu computador.
As câmeras da sala 03 foram desligadas de novo.

Eles não param de olhar.
            </textarea>
        </div>
    </div>

</body>
</html>
